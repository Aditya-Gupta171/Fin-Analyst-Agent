# Statement of Profit and Loss — Division II, Schedule III (Ind AS) line items.
# Amounts in ₹ crore. `aliases` are labels seen in filings; ingestion maps them deterministically
# before falling back to the LLM. `nil_if_absent` marks lines Schedule III only requires when an amount exists:
# if the statement is reported for a period but the line is not, it is read as zero.
statement: profit_and_loss
defaults: { unit: inr_crore, nature: flow, scope: period }
items:
  - key: revenue_from_operations
    label: Revenue from operations
    aliases: [Revenue from operations (net), Income from operations, Net sales, Sales, Total revenue from operations]
  - key: other_income
    label: Other income
    aliases: [Other operating and non-operating income]
  - key: total_income
    label: Total income
    aliases: [Total revenue]
  - key: cost_of_materials_consumed
    label: Cost of materials consumed
    nil_if_absent: true
    aliases: [Cost of raw materials consumed, Raw materials consumed]
  - key: purchases_of_stock_in_trade
    label: Purchases of stock-in-trade
    nil_if_absent: true
    aliases: [Purchase of traded goods, Purchases of traded goods]
  - key: changes_in_inventories
    label: Changes in inventories of finished goods, work-in-progress and stock-in-trade
    nil_if_absent: true
    aliases: [(Increase)/decrease in inventories, Change in inventories]
  - key: employee_benefits_expense
    label: Employee benefits expense
    aliases: [Employee benefit expenses, Staff costs, Employee cost]
  - key: finance_costs
    label: Finance costs
    aliases: [Finance cost, Interest and finance charges, Interest expense]
  - key: depreciation_amortisation
    label: Depreciation and amortisation expense
    aliases: [Depreciation and amortization expense, Depreciation, amortisation and impairment]
  - key: other_expenses
    label: Other expenses
    aliases: [Other expenditure]
  - key: total_expenses
    label: Total expenses
    aliases: [Total expenditure]
  - key: exceptional_items
    label: Exceptional items
    nil_if_absent: true
    description: Reported gain (positive) or loss (negative) presented separately from ordinary activities.
    aliases: [Exceptional items (net), Exceptional gain/(loss)]
  - key: profit_before_tax
    label: Profit before tax
    aliases: [Profit/(loss) before tax, PBT]
  - key: current_tax
    label: Current tax
  - key: deferred_tax
    label: Deferred tax
    nil_if_absent: true
    aliases: [Deferred tax charge/(credit)]
  - key: total_tax_expense
    label: Total tax expense
    aliases: [Tax expense, Income tax expense]
  - key: profit_after_tax
    label: Profit for the period
    aliases: [Profit/(loss) for the period, Profit after tax, Net profit, PAT, Profit for the year]
  - key: profit_attributable_to_owners
    label: Profit attributable to owners of the parent
    aliases: [Owners of the company, Equity holders of the parent]
  - key: other_comprehensive_income
    label: Other comprehensive income
    aliases: [Other comprehensive income/(loss), OCI]
  - key: total_comprehensive_income
    label: Total comprehensive income
  - key: eps_basic
    label: Basic EPS
    unit: inr
    aliases: [Earnings per share - Basic, Basic (₹)]
  - key: eps_diluted
    label: Diluted EPS
    unit: inr
    aliases: [Earnings per share - Diluted, Diluted (₹)]
  - key: paid_up_equity_share_capital
    label: Paid-up equity share capital
    nature: stock
    aliases: [Paid up equity share capital]
  - key: face_value_per_share
    label: Face value per share
    unit: inr
    nature: stock
