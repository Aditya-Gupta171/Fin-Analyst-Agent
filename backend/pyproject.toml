[project]
name = "analyst-agent"
version = "0.1.0"
description = "Self-learning AI financial analyst agent for Indian market filings"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "defusedxml>=0.7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "numpy>=2.0",
  "pdfplumber>=0.11",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
embeddings = [
  "fastembed>=0.8",  # local ONNX embeddings and cross-encoder reranking for the knowledge base
]
dev = [
  "aiosqlite>=0.20",  # SQLite driver used only by the test suite; Postgres (asyncpg) is used at runtime
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
