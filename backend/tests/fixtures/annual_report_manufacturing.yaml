# Fictional company for engine tests. Statements are internally consistent (balance sheets balance, cash flows
# reconcile, EPS matches profit / shares), with red flags deliberately planted in FY25:
#   * trade receivables +55% against revenue +12%, while operating cash flow halves  -> WC_RECEIVABLES_OUTPACE_REVENUE
#   * CFO / PAT = 0.30                                                                 -> EQ_CFO_PAT_DIVERGENCE
#   * PAT +23% while CFO falls from 95 to 50                                           -> EQ_PROFIT_UP_CASH_DOWN
#   * other income is 33% of PBT                                                       -> EQ_OTHER_INCOME_DEPENDENCE
#   * contingent liabilities are 65% of net worth                                      -> GOV_CONTINGENT_LIABILITIES_LARGE
# FY24 is deliberately just inside the receivables threshold (+30% vs +10%, a 20-point gap that does not exceed it).
